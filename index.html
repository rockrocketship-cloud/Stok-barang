<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d32"><title>Lokalin Stock Manager</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20352d;background:#f5f5ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1150px;margin:auto;padding:24px 18px 100px}.header{background:#173d32;color:#fff;padding:23px 25px;border-radius:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.sub{font-size:12px;opacity:.7;margin-top:3px}.pill{border:1px solid #6c8d7e;border-radius:30px;padding:8px 13px;font-size:12px}.title{margin:28px 0 16px;font-size:23px;letter-spacing:-.6px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:white;border:1px solid #e5e9e1;border-radius:18px;padding:19px}.metric small{color:#738078;font-weight:600}.metric strong{display:block;font-size:27px;margin-top:10px;letter-spacing:-1px}.metric em{font-style:normal;font-size:12px;color:#76867b}.tabs{display:flex;gap:7px;overflow-x:auto;margin:24px 0 17px;padding-bottom:4px}.tabs button{white-space:nowrap;border:0;background:#e8ece5;color:#466052;border-radius:12px;padding:12px 16px;font-weight:700}.tabs button.active{background:#173d32;color:white}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap}.controls{display:flex;gap:8px;flex-wrap:wrap}input,select{border:1px solid #dbe3d9;border-radius:10px;padding:12px;background:white;min-width:0}input:focus,select:focus{outline:2px solid #a8c2b4}.btn{background:#173d32;color:white;border:0;border-radius:10px;padding:12px 15px;font-weight:700}.btn.light{background:#eaf0e9;color:#244638}.btn.danger{background:#fff1ed;color:#a03c27}.btn.small{padding:8px 10px;font-size:12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px}th{text-align:left;color:#859087;font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:13px 12px;border-bottom:1px solid #e8eee7}td{padding:15px 12px;border-bottom:1px solid #edf0ea;font-size:13px}td strong{font-size:14px}.tag{border-radius:20px;padding:5px 9px;font-size:11px;font-weight:750;background:#e8f1e9;color:#376347}.tag.low{background:#fff0db;color:#aa6c16}.tag.zero{background:#ffe6e0;color:#a43f30}.empty{text-align:center;padding:35px;color:#839086}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#53665a}.field input,.field select{width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.hint{color:#7d8a80;font-size:12px;line-height:1.6}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.footer{text-align:center;color:#89958a;font-size:12px;margin-top:25px}.notice{background:#fff4de;color:#765a21;padding:12px 15px;border-radius:12px;font-size:12px;margin-top:13px}.rowactions{display:flex;gap:5px;flex-wrap:wrap}dialog{border:0;border-radius:20px;padding:0;width:min(530px,calc(100% - 28px));box-shadow:0 25px 90px #0004}dialog::backdrop{background:#142d25a8}.modal{padding:24px}.modal h2{margin:0 0 18px}.close{float:right;border:0;background:#edf0eb;border-radius:9px;padding:7px 11px}.muted{color:#859087}.topspace{margin-top:16px}@media(max-width:720px){.shell{padding:12px 12px 70px}.header{padding:21px}.cards{grid-template-columns:repeat(2,1fr)}.metric{padding:15px}.metric strong{font-size:23px}.grid2,.formgrid{grid-template-columns:1fr}.title{font-size:21px}.toolbar{align-items:stretch}.controls{width:100%}.controls input{flex:1}.pill{display:none}}
</style></head><body><div class="shell"><header class="header"><div><div class="brand">lokalin<span style="color:#b4d0b4">.</span></div><div class="sub">STOCK MANAGER · BAR & KITCHEN</div></div><div class="pill">INVENTORY SYSTEM</div></header><h1 class="title">Ringkasan Persediaan</h1><section class="cards" id="metrics"></section><div class="tabs" id="tabs"><button data-tab="items" class="active">Daftar Stok</button><button data-tab="move">Barang Masuk / Keluar</button><button data-tab="history">Riwayat</button><button data-tab="report">Laporan & Backup</button></div><main id="content"></main><div class="footer">Lokalin Cafe · Data tersimpan lokal di browser ini</div></div><dialog id="modal"><div class="modal"><button class="close" onclick="document.getElementById('modal').close()">✕</button><h2 id="modalTitle">Tambah Barang</h2><form id="itemForm"><input type="hidden" id="editId"><div class="formgrid"><label class="field">Nama Barang<input id="itemName" required maxlength="100" placeholder="Contoh: Fresh Milk"></label><label class="field">Divisi<select id="itemDept"><option>Bar</option><option>Kitchen</option></select></label><label class="field">Kategori<input id="itemCategory" required placeholder="Contoh: Dairy"></label><label class="field">Satuan<select id="itemUnit"><option>pcs</option><option>kg</option><option>gram</option><option>liter</option><option>ml</option><option>pack</option><option>botol</option><option>karton</option></select></label><label class="field">Stok Awal<input id="itemStock" type="number" min="0" step="any" required value="0"></label><label class="field">Stok Minimum<input id="itemMin" type="number" min="0" step="any" required value="0"></label><label class="field">Harga Beli / Satuan (Rp)<input id="itemPrice" type="number" min="0" step="any" required value="0"></label><label class="field">Supplier (opsional)<input id="itemSupplier" placeholder="Nama supplier"></label></div><div class="form-actions"><button class="btn" type="submit">Simpan Barang</button><button class="btn light" type="button" onclick="document.getElementById('modal').close()">Batal</button></div></form></div></dialog><script>
'use strict';const KEY='lokalin-stock-v1';const examples=[['Coffee Beans','Bar','Coffee','kg',2,1,280000],['Fresh Milk','Bar','Dairy','liter',8,4,22000],['Gula Aren','Bar','Syrup','liter',3,2,72000],['Matcha Powder','Bar','Powder','gram',500,200,450],['Beras','Kitchen','Bahan Pokok','kg',12,5,16000],['Minyak Goreng','Kitchen','Bahan Pokok','liter',6,3,20000],['Udang','Kitchen','Seafood','kg',3,2,95000],['Telur','Kitchen','Bahan Pokok','pcs',40,20,2500]];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.items)||!Array.isArray(state.history))state={items:examples.map((x,i)=>({id:'demo'+i,name:x[0],dept:x[1],category:x[2],unit:x[3],stock:x[4],min:x[5],price:x[6],supplier:''})),history:[]};let tab='items',dept='Semua',search='';const $=id=>document.getElementById(id),rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:0}),num=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:3}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Penyimpanan perangkat penuh atau tidak tersedia. Segera ekspor backup.')}}function status(i){return i.stock===0?'<span class="tag zero">Habis</span>':i.stock<=i.min?'<span class="tag low">Menipis</span>':'<span class="tag">Aman</span>'}function metrics(){const low=state.items.filter(i=>i.stock<=i.min).length;const val=state.items.reduce((a,i)=>a+i.stock*i.price,0);$('metrics').innerHTML=[['Total Barang',state.items.length,'jenis bahan baku'],['Stok Menipis',low,'perlu diperiksa'],['Stok Bar',state.items.filter(i=>i.dept==='Bar').length,'jenis barang'],['Nilai Persediaan',rupiah(val),'estimasi harga beli']].map(x=>`<article class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><em>${x[2]}</em></article>`).join('')}
function render(){metrics();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='items')renderItems();if(tab==='move')renderMove();if(tab==='history')renderHistory();if(tab==='report')renderReport()}function renderItems(){let items=state.items.filter(i=>(dept==='Semua'||i.dept===dept)&&[i.name,i.category,i.supplier].join(' ').toLowerCase().includes(search.toLowerCase()));$('content').innerHTML=`<section class="panel"><div class="toolbar"><div class="controls"><input id="search" placeholder="Cari barang..." value="${esc(search)}" aria-label="Cari barang"><select id="filter"><option>Semua</option><option>Bar</option><option>Kitchen</option></select></div><button class="btn" onclick="openItem()">+ Tambah Barang</button></div><div class="tablewrap"><table><thead><tr><th>Barang</th><th>Divisi</th><th>Stok</th><th>Minimum</th><th>Harga / Unit</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${items.map(i=>`<tr><td><strong>${esc(i.name)}</strong><div class="muted">${esc(i.category)}</div></td><td>${esc(i.dept)}</td><td><strong>${num(i.stock)}</strong> ${esc(i.unit)}</td><td>${num(i.min)} ${esc(i.unit)}</td><td>${rupiah(i.price)}</td><td>${status(i)}</td><td><div class="rowactions"><button class="btn light small" data-edit="${esc(i.id)}">Edit</button><button class="btn danger small" data-delete="${esc(i.id)}">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada barang yang sesuai.</td></tr>'}</tbody></table></div></section><div class="notice">Data contoh telah disediakan sebagai ilustrasi. Silakan ubah stok dan harga sesuai kondisi sebenarnya.</div>`;$('filter').value=dept;$('filter').onchange=e=>{dept=e.target.value;renderItems()};$('search').oninput=e=>{search=e.target.value;renderItems();$('search').focus();$('search').setSelectionRange(search.length,search.length)};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openItem(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.delete))}
function openItem(id){$('itemForm').reset();$('editId').value='';$('modalTitle').textContent='Tambah Barang';if(id){const i=state.items.find(x=>x.id===id);if(!i)return;$('modalTitle').textContent='Edit Barang';$('editId').value=id;for(const [k,v] of Object.entries({itemName:i.name,itemDept:i.dept,itemCategory:i.category,itemUnit:i.unit,itemStock:i.stock,itemMin:i.min,itemPrice:i.price,itemSupplier:i.supplier}))$(k).value=v}$('modal').showModal()};$('itemForm').onsubmit=e=>{e.preventDefault();let id=$('editId').value;let item={id:id||crypto.randomUUID(),name:$('itemName').value.trim(),dept:$('itemDept').value,category:$('itemCategory').value.trim(),unit:$('itemUnit').value,stock:Number($('itemStock').value),min:Number($('itemMin').value),price:Number($('itemPrice').value),supplier:$('itemSupplier').value.trim()};if(!item.name||!item.category||[item.stock,item.min,item.price].some(v=>!Number.isFinite(v)||v<0))return alert('Periksa data barang.');if(id){let old=state.items.find(x=>x.id===id);if(old&&old.stock!==item.stock)record(item, 'Opname',item.stock-old.stock,old.stock,item.stock,'Koreksi saat edit barang');state.items=state.items.map(x=>x.id===id?item:x)}else{state.items.push(item);if(item.stock>0)record(item,'Stok awal',item.stock,0,item.stock,'Pencatatan awal')}save();$('modal').close();render()};function deleteItem(id){let i=state.items.find(x=>x.id===id);if(i&&confirm(`Hapus ${i.name}? Riwayat transaksi tetap tersimpan.`)){state.items=state.items.filter(x=>x.id!==id);save();render()}}function record(i,type,qty,before,after,note){state.history.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),itemId:i.id,name:i.name,dept:i.dept,unit:i.unit,type,qty,before,after,note,price:i.price})}
function renderMove(){$('content').innerHTML=`<section class="panel"><div class="sectionhead"><h2 style="margin:0 0 18px">Catat Pergerakan Stok</h2></div><form id="moveForm"><div class="formgrid"><label class="field">Barang<select id="moveItem" required>${state.items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)} · ${esc(i.dept)} (${num(i.stock)} ${esc(i.unit)})</option>`).join('')}</select></label><label class="field">Jenis Transaksi<select id="moveType"><option value="Masuk">Barang Masuk</option><option value="Keluar">Barang Keluar</option><option value="Opname">Stock Opname (stok aktual)</option></select></label><label class="field" id="qtyLabel">Jumlah<input id="moveQty" type="number" min="0" step="any" required placeholder="0"></label><label class="field">Catatan / Supplier / Keperluan<input id="moveNote" maxlength="200" placeholder="Contoh: pembelian supplier / pemakaian shift"></label></div><div class="form-actions"><button class="btn" type="submit" ${state.items.length?'':'disabled'}>Simpan Transaksi</button></div></form><p class="hint">Barang keluar tidak boleh melebihi stok tersedia. Pada stock opname, masukkan jumlah stok fisik aktual.</p></section>`;$('moveType').onchange=()=>{$('qtyLabel').firstChild.textContent=$('moveType').value==='Opname'?'Stok Fisik Aktual':'Jumlah'};$('moveForm').onsubmit=e=>{e.preventDefault();let i=state.items.find(x=>x.id===$('moveItem').value),type=$('moveType').value,qty=Number($('moveQty').value);if(!i||!Number.isFinite(qty)||qty<0)return alert('Jumlah tidak valid.');if(type!=='Opname'&&qty===0)return alert('Jumlah harus lebih besar dari nol.');if(type==='Keluar'&&qty>i.stock)return alert('Stok tidak mencukupi.');let before=i.stock,after=type==='Masuk'?before+qty:type==='Keluar'?before-qty:qty;record(i,type,type==='Opname'?after-before:qty,before,after,$('moveNote').value.trim());i.stock=after;save();alert('Transaksi berhasil disimpan.');render()}}
function datefmt(d){return new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}function renderHistory(){$('content').innerHTML=`<section class="panel"><h2 style="margin-top:0">Riwayat Transaksi</h2><div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Barang</th><th>Divisi</th><th>Jenis</th><th>Perubahan</th><th>Stok Akhir</th><th>Catatan</th></tr></thead><tbody>${state.history.map(h=>`<tr><td>${datefmt(h.date)}</td><td><strong>${esc(h.name)}</strong></td><td>${esc(h.dept)}</td><td>${esc(h.type)}</td><td>${h.qty>0?'+':''}${num(h.qty)} ${esc(h.unit)}</td><td>${num(h.after)} ${esc(h.unit)}</td><td>${esc(h.note||'-')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></section>`}function renderReport(){$('content').innerHTML=`<div class="grid2"><section class="panel"><h2 style="margin-top:0">Ekspor Laporan</h2><p class="hint">Unduh stok terkini dan seluruh riwayat transaksi dalam format CSV untuk Excel.</p><div class="form-actions"><button class="btn" onclick="exportCSV('items')">Ekspor Stok CSV</button><button class="btn light" onclick="exportCSV('history')">Ekspor Riwayat CSV</button></div></section><section class="panel"><h2 style="margin-top:0">Backup & Restore</h2><p class="hint">Backup JSON menyimpan semua barang dan transaksi. Simpan di tempat aman sebelum pindah perangkat.</p><div class="form-actions"><button class="btn" onclick="backup()">Download Backup JSON</button><label class="btn light" style="cursor:pointer">Impor Backup<input type="file" accept="application/json,.json" style="display:none" onchange="restore(event)"></label></div></section></div><div class="notice">Versi offline: data tidak otomatis tersinkron antarperangkat. Hapus data browser dapat menghilangkan catatan; lakukan backup berkala.</div>`}function download(filename,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function csv(rows){return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function exportCSV(which){let rows=which==='items'?[['Nama','Divisi','Kategori','Satuan','Stok','Minimum','Harga Satuan','Nilai Stok','Supplier'],...state.items.map(i=>[i.name,i.dept,i.category,i.unit,i.stock,i.min,i.price,i.stock*i.price,i.supplier])]:[['Waktu','Barang','Divisi','Jenis','Perubahan','Stok Sebelum','Stok Sesudah','Satuan','Catatan'],...state.history.map(h=>[datefmt(h.date),h.name,h.dept,h.type,h.qty,h.before,h.after,h.unit,h.note])];download('lokalin-'+which+'-'+new Date().toISOString().slice(0,10)+'.csv',csv(rows),'text/csv;charset=utf-8')}function backup(){download('lokalin-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json')}async function restore(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!Array.isArray(data.history)||data.items.some(i=>!i.id||!i.name||!['Bar','Kitchen'].includes(i.dept)||!Number.isFinite(i.stock)||i.stock<0||!Number.isFinite(i.price)||i.price<0||!Number.isFinite(i.min)||i.min<0)||data.history.some(h=>!h.id||!h.date||!h.name))throw Error('Format backup tidak valid');if(!confirm('Impor akan mengganti SEMUA data stok dan riwayat saat ini. Lanjutkan?'))return;state=data;save();render();alert('Backup berhasil diimpor.')}catch(err){alert('Gagal mengimpor: '+err.message)}e.target.value=''}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();</script></body></html>
