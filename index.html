<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokalin Stock Manager</title><style>body{margin:0;background:#f5f5ef;color:#173d32;font:16px -apple-system,BlinkMacSystemFont,Arial}.wrap{max-width:900px;margin:auto;padding:18px}header{background:#173d32;color:white;padding:24px;border-radius:22px}h1{margin:0}section{background:white;padding:20px;margin:16px 0;border:1px solid #ddd;border-radius:18px}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccc;max-width:100%;box-sizing:border-box}input,select{width:100%}button{background:#173d32;color:white;border:0;margin:4px;cursor:pointer}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid>*{min-width:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cards div{padding:18px;background:white;border-radius:16px}.cards b{display:block;font-size:25px;margin-top:8px}.tabs{display:flex;overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}label{display:block;margin:8px 0}small{color:#777}#message{white-space:pre-wrap;color:#a33}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style><main class="wrap"><header><h1>lokalin cafe.</h1><p>Stock Manager · Bar & Kitchen · Cloud</p><span id="who">Belum terhubung</span> <button id="logout" class="hide">Keluar</button></header><section id="setup"><h2>Hubungkan Supabase</h2><p>Gunakan publishable key / anon key. Jangan gunakan secret atau service_role.</p><label>Project URL<input id="url" value="https://kwhtqqrzeifmntdtugvg.supabase.co"></label><label>Publishable key<input id="key" placeholder="sb_publishable_..."></label><button id="connect">Hubungkan</button></section><section id="login" class="hide"><h2>Login</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Masuk</button></form></section><div id="app" class="hide"><div class="cards" id="cards"></div><nav class="tabs"><button data-tab="stock">Stok</button><button data-tab="move">Barang Masuk / Keluar</button><button data-tab="history">Riwayat</button><button data-tab="report">Laporan</button></nav><section id="content"></section></div><p id="message"></p><small>Data dari Supabase; diperbarui setiap 15 detik selama aplikasi terbuka.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=x=>document.getElementById(x),escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x||0).toLocaleString('id-ID',{maximumFractionDigits:3});let db,role,items=[],history=[],tab='stock',busy=false;const message=x=>$('message').textContent=x||'';let config;try{config=JSON.parse(localStorage.getItem('lokalin-cloud')||'null')}catch{}if(config){$('url').value=config.url;$('key').value=config.key}
async function connect(){try{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key)throw Error('URL atau key tidak valid');if(!window.supabase)throw Error('Library Supabase tidak termuat');db=supabase.createClient(url,key);localStorage.setItem('lokalin-cloud',JSON.stringify({url,key}));$('setup').classList.add('hide');db.auth.onAuthStateChange(()=>setTimeout(check,0));await check()}catch(e){message(e.message)}}
async function check(){if(!db)return;const {data:{user},error}=await db.auth.getUser();if(error||!user){role=null;$('login').classList.remove('hide');$('app').classList.add('hide');$('logout').classList.add('hide');$('who').textContent='Login diperlukan';return}const r=await db.from('lokalin_stock_roles').select('role').eq('user_id',user.id).maybeSingle();if(r.error)return message(r.error.message);role=r.data?.role;$('login').classList.add('hide');$('logout').classList.remove('hide');$('who').textContent=user.email+' · '+(role||'belum ada role');$('app').classList.toggle('hide',!role);if(!role)return message('Akun belum diberikan role stok');message('');await refresh()}
$('connect').onclick=connect;$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)message(r.error.message);else check()};$('logout').onclick=async()=>{await db.auth.signOut();check()};if(config)connect();
async function refresh(){if(!role||busy)return;let [a,b]=await Promise.all([db.from('lokalin_stock_items').select('*').order('name'),db.from('lokalin_stock_transactions').select('*').order('created_at',{ascending:false}).limit(250)]);if(a.error||b.error)return message((a.error||b.error).message);items=a.data;history=b.data;render()}
function render(){$('cards').innerHTML=[['Total Barang',items.length],['Stok Menipis',items.filter(i=>+i.quantity<=+i.minimum_stock).length],['Barang Bar',items.filter(i=>i.division==='Bar').length],['Nilai Stok',role==='owner'?'Rp '+fmt(items.reduce((s,i)=>s+i.quantity*i.purchase_price,0)):'Owner saja']].map(([a,b])=>'<div>'+a+'<b>'+b+'</b></div>').join('');if(tab==='stock')stock();if(tab==='move')move();if(tab==='history')logs();if(tab==='report')report()}
function stock(){$('content').innerHTML='<h2>Daftar Stok</h2><div class="scroll"><table><tr><th>Barang</th><th>Divisi</th><th>Stok</th><th>Minimum</th></tr>'+items.map(i=>'<tr><td>'+escapeHtml(i.name)+'</td><td>'+escapeHtml(i.division)+'</td><td>'+fmt(i.quantity)+' '+escapeHtml(i.unit)+'</td><td>'+fmt(i.minimum_stock)+'</td></tr>').join('')+'</table></div>'+(role==='owner'?'<h3>Tambah Barang</h3><form id="add"><div class="grid"><label>Nama<input name="name" required></label><label>Divisi<select name="division"><option>Bar</option><option>Kitchen</option></select></label><label>Satuan<input name="unit" value="pcs" required></label><label>Minimum<input name="min" type="number" min="0" step="any" value="0" required></label><label>Harga beli<input name="price" type="number" min="0" step="any" value="0" required></label></div><button>Tambah (stok awal 0)</button></form>':'');if(role==='owner')$('add').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await db.from('lokalin_stock_items').insert({name:f.get('name'),division:f.get('division'),unit:f.get('unit'),minimum_stock:Number(f.get('min')),purchase_price:Number(f.get('price')),quantity:0});if(r.error)message(r.error.message);else{message('Barang ditambahkan');refresh()}}}
function move(){$('content').innerHTML='<h2>Transaksi Stok</h2><form id="moveform"><label>Barang<select name="item">'+items.map(i=>'<option value="'+escapeHtml(i.id)+'">'+escapeHtml(i.name)+' · '+escapeHtml(i.division)+' ('+fmt(i.quantity)+')</option>').join('')+'</select></label><label>Jenis<select name="type"><option>Masuk</option><option>Keluar</option><option>Opname</option></select></label><label>Jumlah (opname = stok fisik akhir)<input name="qty" type="number" min="0" step="any" required></label><label>Catatan<input name="note" maxlength="200"></label><button '+(!items.length?'disabled':'')+'>Simpan Transaksi</button></form>';$('moveform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),q=Number(f.get('qty'));if(!Number.isFinite(q)||q<0||(f.get('type')!=='Opname'&&q===0))return message('Jumlah tidak valid');busy=true;let b=e.target.querySelector('button');b.disabled=true;try{let r=await db.rpc('lokalin_stock_record',{p_item_id:f.get('item'),p_type:f.get('type'),p_quantity:q,p_notes:f.get('note')||null});if(r.error)throw r.error;message('Transaksi tersimpan di Supabase');busy=false;await refresh()}catch(err){message(err.message)}finally{busy=false;b.disabled=false}}}
function logs(){let names=Object.fromEntries(items.map(i=>[i.id,i.name]));$('content').innerHTML='<h2>Riwayat Transaksi</h2><div class="scroll"><table><tr><th>Waktu</th><th>Barang</th><th>Jenis</th><th>Jumlah</th><th>Sebelum</th><th>Sesudah</th></tr>'+history.map(h=>'<tr><td>'+new Date(h.created_at).toLocaleString('id-ID')+'</td><td>'+escapeHtml(names[h.item_id]||h.item_id)+'</td><td>'+escapeHtml(h.transaction_type)+'</td><td>'+fmt(h.quantity)+'</td><td>'+fmt(h.quantity_before)+'</td><td>'+fmt(h.quantity_after)+'</td></tr>').join('')+'</table></div>'}
function report(){$('content').innerHTML='<h2>Ekspor CSV</h2><button id="export">Download Stok</button>';$('export').onclick=()=>{let rows=[['Nama','Divisi','Satuan','Stok','Minimum','Harga'],...items.map(i=>[i.name,i.division,i.unit,i.quantity,i.minimum_stock,role==='owner'?i.purchase_price:''])],csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='lokalin-stok.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});setInterval(()=>{if(document.visibilityState==='visible'&&role)refresh()},15000);
</script></html>
